# docker-compose.yml — AI Coding Agent Workstation
# Services: LiteLLM Proxy, OpenHands, Caddy (optional reverse proxy)
#
# Usage:
#   cp .env.example .env  # then fill in API keys
#   docker compose up -d
#   docker compose logs -f

services:
  # --- LiteLLM Proxy: Unified model gateway ---
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      - litellm_logs:/app/logs
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - workstation

  # --- OpenHands: AI Coding Agent ---
  openhands:
    image: ghcr.io/all-hands-ai/openhands:latest
    container_name: openhands
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - SANDBOX_RUNTIME_CONTAINER_IMAGE=ghcr.io/all-hands-ai/runtime:latest
      - LLM_BASE_URL=http://litellm:4000
      - LLM_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_MODEL=deepseek-v4-flash
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_PATH:-/home/agent/projects}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_PATH:-/home/agent/projects}:/opt/workspace_base
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - workstation

  # --- Caddy: Reverse Proxy (optional, for HTTPS) ---
  # Uncomment if you want public HTTPS access with a domain.
  # Otherwise, use Tailscale for private access.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: caddy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   networks:
  #     - workstation

networks:
  workstation:
    driver: bridge

volumes:
  litellm_logs:
  # Uncomment if using Caddy
  # caddy_data:
  # caddy_config:
