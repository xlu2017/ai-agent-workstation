# docker-compose.yml — AI Coding Agent Workstation
# Services: local LiteLLM proxy, local OpenHands runtime
#
# Usage:
#   cp .env.example .env  # then fill in API keys
#   scripts/vendor-source-repos.sh
#   scripts/build-offline-images.sh
#   docker compose up -d
#   docker compose logs -f

services:
  # --- LiteLLM Proxy: local model gateway image ---
  litellm:
    image: ${LITELLM_IMAGE:-localhost/litellm-platform:local}
    container_name: litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm_config.yaml:/app/config.yaml:ro
      - litellm_logs:/app/logs
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - workstation

  # --- OpenHands: canonical local agent runtime ---
  openhands:
    image: ${OPENHANDS_IMAGE:-localhost/openhands-platform:local}
    container_name: openhands
    restart: unless-stopped
    ports:
      - "${OPENHANDS_PORT:-3000}:3000"
    environment:
      - LLM_BASE_URL=http://litellm:4000
      - LLM_API_KEY=${LITELLM_MASTER_KEY}
      - LLM_MODEL=${OPENHANDS_LLM_MODEL:-deepseek-v4-flash}
      - WORKSPACE_MOUNT_PATH=${WORKSPACE_PATH:-/home/agent/projects}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_PATH:-/home/agent/projects}:/opt/workspace_base
      - /opt/workstation/sessions:/opt/workstation/sessions
    depends_on:
      litellm:
        condition: service_healthy
    networks:
      - workstation

networks:
  workstation:
    driver: bridge

volumes:
  litellm_logs:
