id: accessibility-label-bug
repo: cypress-realworld-app
title: "Add missing aria-labels to icon-only buttons"
difficulty: easy
category: accessibility
instruction: |
  Several icon-only buttons (like, comment, notification bell) in the app
  lack aria-label attributes, making them inaccessible to screen readers.
  The aria-labels were accidentally removed during a refactor. Add
  appropriate aria-labels to all IconButton components that only contain
  an icon (no visible text). Use descriptive labels like "Like transaction",
  "Add comment", "View notifications".
seed_patch: seed.patch
expected_files:
  - src/components/TransactionDetail.tsx
  - src/components/NavBar.tsx
validation_commands:
  - "yarn test --watchAll=false --testPathPattern='TransactionDetail|NavBar'"
context_source: browser
risk_level: low
success_criteria: |
  - All icon-only buttons have descriptive aria-label
  - Screen reader announces button purpose correctly
  - No existing tests broken
notes: "Accessibility is often neglected; tests agent's WCAG awareness."
