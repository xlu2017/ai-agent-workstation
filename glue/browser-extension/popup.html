<!DOCTYPE html>
<html>
<head>
  <style>
    body { width: 300px; padding: 16px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; }
    h2 { margin: 0 0 12px; font-size: 15px; color: #1a1a2e; }
    .btn { display: block; width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #e2e8f0; border-radius: 6px; background: #f8fafc; cursor: pointer; font-size: 13px; text-align: left; transition: all 0.15s; }
    .btn:hover { background: #eef2ff; border-color: #4f46e5; }
    .btn-primary { background: #4f46e5; color: white; border-color: #4f46e5; }
    .btn-primary:hover { background: #4338ca; }
    .status { margin-top: 12px; padding: 8px; border-radius: 4px; background: #f1f5f9; font-size: 12px; color: #64748b; }
    .status.connected { background: #ecfdf5; color: #059669; }
    .status.error { background: #fef2f2; color: #dc2626; }
    .session-info { margin-top: 8px; font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <h2>AI Agent UI Bridge</h2>
  <button class="btn btn-primary" id="inspect">Inspect Element for Agent</button>
  <button class="btn" id="send-selection">Send Selection to Agent</button>
  <div class="status" id="status">Checking bridge service...</div>
  <div class="session-info" id="session-info"></div>
  <script src="popup.js"></script>
</body>
</html>
