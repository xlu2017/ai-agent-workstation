name: workstation-remote-desktop

services:
  guacamole-init:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-1.5.5}
    user: "0:0"
    restart: "no"
    env_file:
      - .env
    volumes:
      - guacamole-init:/init
    entrypoint:
      - /bin/sh
      - -ec
      - |
        /opt/guacamole/bin/initdb.sh --postgresql > /init/01-guacamole-schema.sql

        escape_sql() {
          printf "%s" "$$1" | sed "s/'/''/g"
        }

        rdp_host=$$(escape_sql "$${RDP_HOST:-dev-server}")
        rdp_port=$$(escape_sql "$${RDP_PORT:-3389}")
        rdp_username=$$(escape_sql "$${RDP_USERNAME:-agent}")
        rdp_password=$$(escape_sql "$${RDP_PASSWORD:-}")
        color_depth=$$(escape_sql "$${GUACAMOLE_RDP_COLOR_DEPTH:-16}")

        cat > /init/02-default-rdp-connection.sql <<SQL
        WITH inserted_connection AS (
          INSERT INTO guacamole_connection (connection_name, protocol)
          VALUES ('Workstation xRDP', 'rdp')
          RETURNING connection_id
        )
        INSERT INTO guacamole_connection_parameter (connection_id, parameter_name, parameter_value)
        SELECT connection_id, parameter_name, parameter_value
        FROM inserted_connection
        CROSS JOIN (
          VALUES
            ('hostname', '$${rdp_host}'),
            ('port', '$${rdp_port}'),
            ('username', '$${rdp_username}'),
            ('password', '$${rdp_password}'),
            ('security', 'any'),
            ('ignore-cert', 'true'),
            ('color-depth', '$${color_depth}'),
            ('resize-method', 'display-update'),
            ('disable-audio', 'true'),
            ('enable-wallpaper', 'false'),
            ('enable-font-smoothing', 'false'),
            ('enable-desktop-composition', 'false'),
            ('enable-menu-animations', 'false'),
            ('enable-drive', 'false')
        ) AS params(parameter_name, parameter_value);

        INSERT INTO guacamole_connection_permission (entity_id, connection_id, permission)
        SELECT e.entity_id, c.connection_id, 'READ'
        FROM guacamole_entity e
        CROSS JOIN guacamole_connection c
        WHERE e.name = 'guacadmin'
          AND e.type = 'USER'
          AND c.connection_name = 'Workstation xRDP'
        ON CONFLICT DO NOTHING;
        SQL

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-guacamole}
      POSTGRES_USER: ${POSTGRES_USER:-guacamole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in ops/remote-desktop/.env}
    volumes:
      - guacamole-postgres-data:/var/lib/postgresql/data
      - guacamole-init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    depends_on:
      guacamole-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-guacamole} -d $${POSTGRES_DB:-guacamole}"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - remote-desktop

  guacd:
    image: guacamole/guacd:${GUACAMOLE_VERSION:-1.5.5}
    restart: unless-stopped
    expose:
      - "4822"
    networks:
      - remote-desktop

  guacamole:
    image: guacamole/guacamole:${GUACAMOLE_VERSION:-1.5.5}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GUACD_HOSTNAME: guacd
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole}
      POSTGRESQL_USER: ${POSTGRES_USER:-guacamole}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in ops/remote-desktop/.env}
    ports:
      - "${GUACAMOLE_BIND_HOST:-127.0.0.1}:${GUACAMOLE_PORT:-8080}:8080"
    depends_on:
      guacd:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/guacamole/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - remote-desktop

networks:
  remote-desktop:
    driver: bridge

volumes:
  guacamole-init:
  guacamole-postgres-data:
